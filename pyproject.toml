# Galatea 开发环境定义（ACT-08，Q-T08：uv lock 哈希锁定；Q-T01：Python 3.12 pin 补丁版）
# 重建：uv sync（自动创建 .venv 并按 uv.lock 哈希校验安装）；测试：uv run pytest
[project]
name = "galatea"
version = "0.1.0"
description = "Galatea：单一认知个体——一切'具备'以可干预、可测量、可复算的真实因果结构为证"
requires-python = "==3.12.13"
dependencies = [
    "duckdb>=1.0",
    "numpy>=2.0",
    "polars>=1.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "torch>=2.0",
]

[project.optional-dependencies]
tessera = [
    "cbor2>=6.1.5",
    "eclipse-zenoh>=1.10.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.1",
    "pyright==1.1.414",
    "types-pyyaml>=6.0.12.20260906",
    "import-linter>=2.15",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["galatea", "tests"]
addopts = "-q --import-mode=importlib"   # 2026-10-03：importlib 导入模式——测试模块基名可跨目录重名
                                         # （L02 §10 test_determinism.py 与 tests/env 同名；namespace 布局保持，无 __init__.py）

[tool.uv]
package = false

# REV-0012 R7 / Q-L13-05 C0 期义务：import-linter 契约测试（静态禁写路径机械化）
[tool.importlinter]
root_package = "galatea"

[[tool.importlinter.contracts]]
name = "主体平面禁读证据/治理平面（P04）"
type = "forbidden"
source_modules = ["galatea.subject"]
forbidden_modules = ["galatea.evidence"]

[[tool.importlinter.contracts]]
name = "环境平面禁 import 主体平面（P06/P14）"
type = "forbidden"
source_modules = ["galatea.env"]
forbidden_modules = ["galatea.subject"]

[[tool.importlinter.contracts]]
name = "sensorium 禁触行动/目标/知觉平面（P09 实检）"
type = "forbidden"
source_modules = ["galatea.subject.sensorium"]
forbidden_modules = ["galatea.subject.action", "galatea.subject.goals", "galatea.subject.perception"]

[[tool.importlinter.contracts]]
name = "kernel 横切基础独立于一切上层"
type = "independence"
modules = ["galatea.kernel"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
