# Galatea P4-β 冻结规格 — 心智扩展（草稿板/思维迭代/慢环深思 + GCTB 子集）
# 效力：P4-β 门冻结合同（拟 ADR-G-0033 · tag p4-beta-freeze）。
# 纪律：全部数值溯源本批裁决（Q-L04-15 / Q-L07-09 / Q-L07-10 / Q-L09-11 / Q-L13-21 /
# Q-T02 补裁③，AI-v2 2026-10-16）+ 冻结前可行性探针实测（硬机制第八次执行——
# evidence/p4_beta_probe/probe_report.json verdict=PASS，四层全绿）+ 既有冻结常数。
# 宪法语境：给定权重确定性；GPU 认证 = Q-T02 补裁③ 程序（本 profile 预留 device 认证态）。
# 运行前修订 v1.3（2026-10-16，Q-L13-22 owner α 裁决执行）：two_step 任务形完整重设计 +
#   判据重冻（sep>0.10 ∧ dominance>0.60——探针实测 0.280/0.760 锚定；旧判据随旧统计量
#   退役非降级——新统计量标度不同，判据形承 Q-L13-19② 双分离优先不变）。
# 运行前修订 v1.2（2026-10-16，实现期 GPU 认证收尾）：device_certification.status →
#   certified_cuda（认证程序全绿——scripts/p4beta_gpu_cert.py，隔离 CUDA venv 执行）；
#   生产 claim 运行迁 GPU（owner 2026-10-16 指令兑现；two_step/optout 为 numpy 任务
#   device 无关，think_first RSSM 仪器在认证环境执行；I1 = 同环境双跑 bit-exact）。
# 运行前修订 v1.1（2026-10-16，实现期首单元——P4-α profile v1.1 lr 先例）：
#   ① slow_clock 阈值冻结（Q-L09-11③"数值探针后定"兑现，全锚既有冻结常数零新自由常量）
#     — arousal_low=0.1（锚 Q-L05-03 hysteresis_band = 2 × render_noise_sigma(0.05, m0 冻结)）
#     — urgency_idle=0.0（锚 Q-L08-09④ C-5 支持判定 urgency>0 活跃信号判据的补集）
#     — check_interval_cycles=1（逐拍检测——触发判据本身即频度门，零信息新常量）
#   ② thought_iteration.convergence_mode=no_new_successor（Q-L07-10③ 收敛子句
#     "评分改进<冻结阈值"的确定性机械操作化：离散生成器零改进后继即收敛，零新自由常量；
#     Q-L07-10 行内补裁注记，登记册同批）
profile:
  id: p4_beta_mind
  version: v1.3
  frozen_at: "2026-10-16"
  authority: AI-v2
  spec_ref: design/HLD.md  # §15.5 P4-β 行
  ruling_refs: [Q-L04-15, Q-L07-09, Q-L07-10, Q-L09-11, Q-L13-21, Q-T02, Q-L13-19]

determinism:                                  # Q-T02 补裁③（设备维开放——认证程序）
  torch_version: "2.14.1+cpu"                 # 生产 claim 运行默认设备 = CPU（锚历史延续）
  device_certification:                       # GPU 认证态（v1.2 运行前修订翻转——认证程序绿）
    status: certified_cuda                    # Q-T02 补裁③ 认证绿（2026-10-16）：层A 正式复验 + RSSM 录制/重放 + 训练双跑全 bit-exact
    torch_version_cuda: "2.14.1+cu130"        # 认证 venv 版本（隔离 venv，项目锁零触碰）
    cert_evidence: evidence/p4_beta_gpu_certification/cert_report.json
    cert_regression: tests/evidence/test_p4_beta_probe.py::test_probe_layer_a_gpu_determinism
    cuda_env: {CUBLAS_WORKSPACE_CONFIG: ":4096:8", use_deterministic_algorithms: true}
    isolated_venv: torch 2.14.1+cu130         # 项目锁环境零触碰（ADR-G-0031 §7 先例）
  num_threads: 1
  use_deterministic_algorithms: true
  default_dtype: float32
  global_rng_forbidden: true
  inference_double_run: bit-exact

scratchpad:                                   # Q-L07-09（假设槽草稿板）
  hypothesis_schema: DraftHypothesis          # {claim, provenance_ref, confidence,
                                              #  created_cycle, status}
  status_vocabulary: [open, evaluated, superseded, contradicted]
  non_belief_principle: true                  # 条目非信念——禁直进 L03/L04 信念面
  promotion: explicit_evaluation_loop         # Q-L07-10 循环产出，逐案留痕
  snapshot: workspace_checkpoint面             # 全状态入 workspace 快照（Q-L13-17 同族）

thought_iteration:                            # Q-L07-10（思维迭代循环）
  loop: [generate, evaluate, contradict, revise]
  evaluate_source: rssm_imagine_rollout       # P4-α 世界模型想象面复用（Q-L04-12）
  receipt: DraftThoughtReceipt                # 拍号/供体/评分/矛盾引用/动作——逐拍留痕
  contradiction_event: typed                  # ContradictionEvent（探针实证可开火）
  think_steps_budget: 8                       # 冻结探针值（B3：8 步预算过滤超可行计划）
  convergence_mode: no_new_successor          # v1.1②（确定性收敛操作化，零新自由常量）

slow_clock:                                   # Q-L09-11（慢环调度）
  trigger: [idle_cycle, low_arousal]          # 空闲拍 / 低唤起
  arousal_low: 0.1                            # v1.1①（锚 Q-L05-03 band = 2×render_noise_sigma）
  urgency_idle: 0.0                           # v1.1①（锚 Q-L08-09④ urgency>0 活跃判据补集）
  check_interval_cycles: 1                    # v1.1①（逐拍检测——触发判据即频度门）
  products: scratchpad_hypotheses             # 产物 = 草稿板假设/计划候选
  action_plane: unchanged                     # 行动面经 gateway 原样——零新增权限
  audit: resident_audit_stream                # 迁移审计流扩展

gctb:                                         # Q-L13-21（判据数值——探针冻结，REV-0028 R3 兑现）
  two_step_task:                              # v1.3 运行前修订（Q-L13-22 owner α 裁决——任务形完整重设计）
    trials: 400                               # 重设计值（Q-L13-22 探针：120t 桶样本不足 + 漂移致可判定性证伪）
    per_trial_drift: none                     # 去每拍漂移（漂移决定性实证：0.01 即崩——非平稳带宽必须 ≫ 再学窗口）
    reversal_at: 60                           # 固定单次反转（教科书 reversal 范式；340 稳态拍供分离表达）
    transition_common: 0.8
    reward_good: 0.8
    mb_alpha: 0.5                             # endstate 价值更新（传播机制不变）
    habit_alpha: 0.2                          # 支线历史平均（不变）
    choice_rule: softmax                      # 重设计：argmax → softmax（β=5）——确定性 argmax 哑化信号（Q-L13-22 诊断①）
    softmax_beta: 5.0
    value_decay: 0.9                          # 重设计：价值衰减（无衰减动力学锁死状态）
    statistic: regression_interaction         # 重设计：桶均值差 → Daw 式 stay ~ reward×common interaction（IRLS 确定性零 RNG）
    criterion_separation: ">0.10"             # 重冻（探针 0.280 的 2.8× margin；旧 >0.01 系旧统计量标度随统计量退役）
    criterion_dominance: ">0.60"              # 重冻（探针逐种子优势率 0.760，n=40 二项 2σ 余量）
    probe_measured: {block_sep_mean: 0.280, block_cv: 0.236, blocks_sign_consistent: 20/20, per_seed_dominance: 0.760}
    probe_provenance: Q-L13-22 方向对比探针（研究级 20 块×40 种子 + 200 种子逐种子测量，登记册行在案）
  opt_out_metacognition:
    arms: 2
    true_p_range: [0.05, 0.25]
    safe_harbor: 0.3
    trials: 30
    criterion_gain: ">0"
    probe_measured: {gain: 2.085}
  think_first_advantage:
    budget_steps: 8                           # 路线可行性预算（继承 rollout 上界 Q-L04-01）
    criterion: TFA_corrected == true          # 关循环陷阱选择 → 开循环纠正到可行真最优
    contradiction_required: true              # 矛盾检出必须开火（INC-08 可失败性）
    probe_measured: {without: D1, with: D2, true_best: D2, tfa: true, contradiction: true}
  probe_anchors:
    probe_report: evidence/p4_beta_probe/probe_report.json
    world_seed: 20261016
    stream_source: p4.alpha cell-0（真实 MW0 流）
