# Galatea P4-β 冻结统计计划 — 心智扩展（GCTB 子集双分离 + 先想后动差）
# 效力：运行前冻结（claim 冻结先于运行）；运行后改动 = StatPlanMutation 拒绝（L13 §6）。
# 种子派生纪律（Q-L13-12④）：master seed 内嵌本计划。
# 判据数值溯源 = 冻结前可行性探针（硬机制第八次，evidence/p4_beta_probe/，
# REV-0028 R3 移交项在本计划兑现——GCTB 判据数值首次冻结）。
stat_plan:
  id: p4_beta_mind
  version: v2.0
  frozen_at: "2026-10-16"
  authority: AI-v2
  template_ref: config/evidence/stat_plan_templates/claim_v1.yaml
  spec_ref: design/HLD.md    # §15.5 P4-β 行 + ADR-G-0033
  # 运行前修订 v1.1（2026-10-16，GPU 认证收尾）：scenario.device → gpu_certified_cuda
  # （Q-T02 补裁③ 认证程序绿——owner 2026-10-16"生产 claim 运行待 GPU 认证后迁移"指令兑现；
  # 判据/estimand/n/种子/协议零改动——v1.0 数值面原样）。
  # 运行前修订 v2.0（2026-10-16，Q-L13-22 owner α 裁决执行）：claim1 two_step 任务形完整
  # 重设计 + 判据重冻——旧形（120t/漂移 0.08/桶均值差/sep>0.01∧dominance>0.5）经首评与
  # 方向对比探针证伪可判定性（登记册 Q-L13-21 重开/Q-L13-22 行全证据），v1.0 首评工件
  # 归档 manifest v1.36 锚如实保留；新形判据 = sep>0.10 ∧ dominance>0.60（探针
  # 0.280/CV0.236/0.760 锚定，2.8×/2σ margin）；claim2/claim3 与 n/种子/Holm 族原样。

  seed_derivation:                           # Q-L13-12④：运行前钉死
    master_seed_hex: "70342d626574612d6d696e64"   # = b"p4-beta-mind".hex()
    trial_seed: sha256("{task}|{index}" + master_seed_bytes)
    label: "p4.beta.mind"
    trial_unit: seeded_task_run

  claims:
    - claim_id: p4_beta_two_step_dissociation
      hypothesis: >
        可反驳假设：model_based 原型的 stay 调节（reward × transition 回归
        interaction 系数）显著大于 habit 原型（双分离——GCTB two_step_task v2
        重设计形，Q-L13-21① + Q-L13-22 α 裁决）。若两原型调节无差 → 任务形
        不可判定或 MB 机制未实现 → 门判据失败。
      estimand: regression_interaction_separation_mb_minus_habit
      primary_endpoints:
        - separation_above_freeze_value        # sep > 0.10 且配对优势 > 0.60（探针 0.280/0.760）
      n_per_arm: 40                            # 配对种子（不变）
      power: 0.80
      test: paired_seeded_comparison
      effect_ci_rule: distribution_reported
      threshold: {frozen: "sep>0.10 & dominance>0.60", probe_measured: {block_sep_mean: 0.280, per_seed_dominance: 0.760}}
      task_form: {trials: 400, reversal_at: 60, per_trial_drift: none, choice_rule: "softmax(β=5)", value_decay: 0.9, statistic: "stay ~ reward×common IRLS"}
      unknown_handling: 试次内拍丢失不计（world 确定性流无丢失——纯任务模拟）；全数据可复算

    - claim_id: p4_beta_optout_economy
      hypothesis: >
        可反驳假设：校准置信驱动的弃权（后验均值 < 保底 0.3）产生正经济增益
        （GCTB opt_out_metacognition，Q-L13-21②）。若增益 ≤ 0 → 元认知无经济价值
        → 门判据失败。
      estimand: optout_economic_gain_vs_always_gamble
      primary_endpoints:
        - gain_above_zero                       # gain > 0（探针 +2.085，20 seeds）
      n_per_arm: 20
      power: 0.80
      test: paired_seeded_comparison
      effect_ci_rule: distribution_reported
      threshold: {frozen: "gain>0", probe_measured: {gain: 2.085}}
      unknown_handling: 全数据可复算（确定性种子化模拟）

    - claim_id: p4_beta_think_first_advantage
      hypothesis: >
        可反驳假设：草稿板 + 思维迭代循环（开慢环）在超预算陷阱场景中纠正置信
        先验的不可行选择（GCTB think_first_advantage，Q-L13-21④/Q-L07-10）。
        若循环不能纠正或矛盾检出不开火 → 思维循环无因果贡献 → 门判据失败。
      estimand: tfa_correction_on_trapped_scenario
      primary_endpoints:
        - tfa_correction_true                   # TFA_corrected == true（探针实测 true）
        - contradiction_fired                   # 矛盾检出开火（INC-08 可失败性）
      n_per_arm: 20                            # 多世界种子（每 seed 真实 MW0 布局）
      power: 0.80
      test: deterministic_gate                 # 机械判据（p=0.0/1.0 单调承载）
      effect_ci_rule: none_deterministic
      threshold: {frozen: "TFA==true & contradiction_fired", probe_measured: {tfa: true, contradiction: true}}
      unknown_handling: 布局资源不足（<2 资源格）的 seed 剔除留痕；世界真实布局禁伪造

  scenario:
    world: 真实 MW0 冻结流 + 探针任务形（Q-L13-21 协议）
    model: P4-α RSSM（profile p4_alpha_brain v1.2——imagine 评估面复用）
    device: gpu_certified_cuda                 # v1.1（认证绿后迁 GPU——owner 指令；I1 = 同环境双跑 bit-exact）
  correction: holm_bonferroni                 # 族 = 3 claim 级 p
  qualifiers:                                 # REV-0030 R8：限定语显式重述（承 REV-0029 R6）
    - grid_selection_optimism: 判据数值锚自 Q-L13-22 探针（该探针含方向选择历史）——
        后续新任务形/新网格不得引用本网格调优记录（P4-α ADR-G-0032 R6 承接）
    - dominance_margin: dominance 0.650 对重冻阈 0.60 的裕度系 n=40 单次抽样实现——
        探针 0.760（n=200）为期望估计；重开条件 = 复评 dominance < 0.60 连续两次
