# Galatea P4-γ 冻结统计计划 — 行动与学习（MPC 规划优势 + 睡眠增益 + 在线门）
# 效力：运行前冻结（claim 冻结先于运行）；运行后改动 = StatPlanMutation 拒绝（L13 §6）。
# 种子派生纪律（Q-L13-12④）：master seed 内嵌本计划。
# 判据数值溯源 = 冻结前可行性探针（硬机制第九次，evidence/p4_gamma_probe/，Q-G00-16）。
stat_plan:
  id: p4_gamma_mind
  version: v1.3
  frozen_at: "2026-10-17"
  revisions:                                # 运行前修订留痕（claim 未运行；L13 §6）
    - v1.1 2026-10-23 owner 裁决「GPU 问题修正为 cpu 运行」——开发机无 NVIDIA GPU（INC-16 迁移），
      scenario.device gpu_certified_cuda → cpu；profile loader CPU 路径合同不变（runtime ==
      torch_version 2.14.1+cpu，p4profile._resolve_torch_version 首路径放行）；estimand/判据数值/
      种子派生/claims 零改动
    - v1.2 2026-10-28 owner 裁决「采纳 A」（Q-L13-23 行内补裁②/Q-L10-18 补裁②）——claim1 任务形
      替换 v2（REV-0031 R1 移交项兑现，claim 零运行在先）：带控经济（band [0.4,0.8] + 代谢税
      look −0.005 + eat 链四动作 input_dim=5 + 计划集 v2）；estimand/主判据/归因面重冻；
      claim2/claim3 estimand/判据/种子/通路零改动；世界冻结参数零触碰（任务层 overlay）
    - v1.3 2026-10-29 owner 裁决「α」（Q-L13-23 行内补裁④）——claim3 构造修正重评：
      受保护臂 = dream 混合候选（finetune(parent, phase2 前半 ⊕ dream(parent))——
      ADR-G-0035 R2 同尺语义，方向探针 B 臂证据指明可准入形）× 重放深度 300..1200
      十档自然分布；回归臂 = 10 种确定性损毁（去同质）；判据零改动（20/20 判别正确
      + 构造有效双向）；INC-08 迷你探针先证双可行（最弱/最强受保护 + 两种损毁
      四案例全对）方准正式运行；v1.2 形 REFUTED 工件保留归档（manifest v1.44 锚
      e7f64e87——纯微调构造缺陷诊断在案）
  authority: AI-v2
  template_ref: config/evidence/stat_plan_templates/claim_v1.yaml
  spec_ref: design/HLD.md    # §15.5 P4-γ 行 + ADR-G-0035

  seed_derivation:                           # Q-L13-12④：运行前钉死
    master_seed_hex: "70342d67616d6d612d6d696e64"  # = b"p4-gamma-mind".hex()
    trial_seed: sha256("{task}|{index}" + master_seed_bytes)
    label: "p4.gamma.mind"
    trial_unit: seeded_task_run

  claims:
    - claim_id: p4_gamma_mpc_planning_advantage
      hypothesis: >
        可反驳假设（v1.2 任务形 v2——REV-0031 R1 移交项，owner「采纳 A」）：EFE 驱动的
        模型基规划主体（动作条件化 RSSM 想象上枚举 + eat 链，Q-L10-18 补裁②）在 MW0
        带控能量调节任务（band [0.4,0.8] + 代谢税 + 带外排放计罚）中优于冻结反应式脚本
        基线，且优势由学到的世界模型承载（盲化消融归因面）。若无优势或优势不随模型消融
        消失 → 模型驱动规划无因果贡献 → 门判据失败。文献语境（呈递 owner 裁决依据）：
        确定性小任务上调谐反射式策略近优（Ernst 2009/Dunbar 2022）——hysteresis 臂为
        descriptive 非判据；任务形 = 主动推理带控范式（Pezzulo 2015）；统计形 = 胜率
        probability-of-improvement（Agarwal 2021 rliable）+ 消融归因（MBRL 标准）。
      estimand: paired_mean_band_deviation_script_minus_mpc
      primary_endpoints:
        - advantage_above_freeze_value         # 配对均值差 > 0.005（方向探针 0.0147 的 ~2.9× margin）
        - per_seed_wins_majority               # 逐种子胜率 > 0.5（方向探针 8/8）
      attribution_endpoint:                    # 机械归因面（MBRL 消融标准）
        blind_ablation_advantage: 0.01         # 模型速率位清零臂 − mpc 臂 配对差 > 0.01（方向探针 0.1775）
      task_validity_guard:                     # 任务非退化金丝雀（违反 = 运行无效非 claim 失败）
        const_rest_must_lose: const_rest mean_dev > script mean_dev（逐种子多数）
      n_per_arm: 16                            # 配对世界种子（stat plan 冻结值不变）
      power: 0.80
      test: paired_seeded_comparison
      effect_ci_rule: distribution_reported
      threshold: {frozen: "advantage>0.005 & wins>0.5 & blind>0.01", probe_measured: {advantage: 0.0147, wins: "8/8", blind_advantage: 0.1775}}
      de_functional_baselines: descriptive     # hysteresis（调谐反射——文献一致近优语境）+ const_rest（金丝雀）
      unknown_handling: 全数据可复算（确定性种子化模拟）

    - claim_id: p4_gamma_sleep_gain
      hypothesis: >
        可反驳假设：生成式重放做梦巩固（dream 混入微调，Q-L06-09）降低旧任务遗忘
        （Q-L13-23②——睡眠增益）。若重放不减少遗忘 → 做梦巩固无因果贡献 → 门判据失败。
      estimand: forgetting_difference_a_minus_b
      primary_endpoints:
        - replay_reduces_forgetting            # forget_a > forget_b（配对相位差，探针 +0.000292）
        - replay_arm_no_regression             # forget_b ≤ 0.1 × pre（重放臂不退化，探针 forget_b < 0）
      n_per_arm: 8                             # 配对相位（流种子对）
      power: 0.80
      test: paired_seeded_comparison
      effect_ci_rule: distribution_reported
      threshold: {frozen: "forget_a>forget_b & forget_b<=0.1*pre", probe_measured: {forget_a: 0.000186, forget_b: -0.000105}}
      unknown_handling: 全数据可复算

    - claim_id: p4_gamma_online_gate_discrimination
      hypothesis: >
        可反驳假设：双域不退化门（Q-L11-09②）正确判别候选——回归候选拒收、
        受保护候选入场（Q-L13-23③ 保护不退化门——机械确定性判据）。
        若门判别错误 → 在线学习门不可信 → 门判据失败。
      estimand: gate_discrimination_correctness
      primary_endpoints:
        - all_cases_correct                    # 逐案判别正确 = true（机械门，INC-08 可失败性）
      n_per_arm: 20                            # 构造候选案例（回归/受保护各半，确定性构造）
      power: 0.80
      test: deterministic_gate
      effect_ci_rule: none_deterministic
      threshold: {frozen: "all_correct", probe_measured: {A_rejected: true, B_admitted: true}}
      unknown_handling: 全数据可复算

  scenario:
    world: 真实 MW0 冻结流 + 条件化 RSSM（claim1 = 任务形 v2 input_dim=5，profile p4_gamma_mind v1.1；
      claim2/claim3 = v1.0 三动作通路零触碰）
    device: cpu                                # v1.1（2026-10-23 owner 裁决）延续——v1.2 修订零改动
  correction: holm_bonferroni                  # 族 = 3 claim 级 p
  qualifiers:                                  # 承 REV-0029 R6 / REV-0030 R8 / REV-0031 R1/R5 限定语纪律
    - grid_selection_optimism: claim1 v2 判据锚自任务形方向探针（scripts/p4gamma_taskform_probe.py
        迭代 2，n=8）；正式 n=16 承载抽样波动；新探针禁引用本探针调优记录
    - hysteresis_parity_context: 方向探针实测 hysteresis 与 mpc 打平（−8e-05）——文献一致
        （确定性小任务调谐反射式近优，Ernst 2009/Dunbar 2022）；故 hysteresis 为 descriptive
        非判据；规划优势差异化场景（部分可观测/随机性）= P4-γ+ 研究单元登记非本门阻塞
    - mpc_degeneracy_disclosure: REV-0031 R1 探针形塌缩已由任务形 v2 处置（v1.2 修订）；
        const_rest 金丝雀转正为 task_validity_guard（劣败消失 = 运行无效守卫）
    - secondary_faces: in_band_fraction / min_energy 为描述性副面（方向探针实测 mpc 0.766
        vs const_rest 0.0）
