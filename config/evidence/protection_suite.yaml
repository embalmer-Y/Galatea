# Galatea 证据合同 — 保护场景清单（L13 §4.5 ProtectionSuite；L01 §7"每门退出冻结为保护集"）
# 效力：v1.0 = M1 门版（2026-09-26 追溯冻结——M0/M1 退出时本义务漏执行，INC-12 立案）。
#       v1.1 = M2 门版（2026-09-26，M2 退出单元增补 M2 场景——只增不减纪律）。
#       v1.2 = R0 门版（2026-10-02，R0 退出单元增补 R0 场景——只增不减纪律）。
# 纪律：保护集**只增不减**（退役须 DEV_SPEC §4.6 难逆决策裁定 + 记录，禁静默删除）；
# 每门退出前更新本清单（新增该门关键场景 + 复核基线未退化）；基线 = 冻结测试断言
#（确定性模拟中 bit-exact 断言即基线；统计型场景以冻结统计计划为准绳）。
protection_suite:
  id: m1_protection_suite
  version: v1.2                 # v1.2（R0 门版）：新增 r0_* 9 场景；既有 23 场景原样保留（只增不减）
  frozen_at: "2026-10-02"
  authority: AI-v2
  spec_ref: design/lld/L13_evidence_evaluation_registry.md
  retroactive_note: >
    INC-12（2026-09-26）：L13 §4.5"门退出前冻结保护集"在 M0（ADR-G-0005）与 M1
    （ADR-G-0007）退出时均未履行（REV-0005/0007 均未对照该条）——根因：门退出判据
    映射仅取 HLD §10.2 行 + 对应 LLD §9，未扫描跨档义务。v1.0 为追溯补冻；
    门退出义务核对自本案起将 L13 §4.5 纳入（v1.1 M2 首次正常执行、v1.2 R0 第二次）。
  baseline_semantics: deterministic_bit_exact   # 确定性阶段：测试断言 = 基线；C1+ 噪声组件后换统计基线

  scenarios:
    - id: m0_world_replay_bitexact
      source_test: galatea/kernel/tests/test_replay.py
      frozen_gate: M0
      assertion: 同 (profile, seed, 轨迹) 世界轨迹 tick 级 bit-exact；异 seed 发散
    - id: m0_channel_leakage_two_layer
      source_test: tests/env/test_leakage_env.py
      frozen_gate: M0
      assertion: 主体可见信号与 WorldTruth 双向隔离（含注入违规自检可报红）
    - id: m0_e2e_replay_full_chain
      source_test: tests/env/test_intervention_battery.py::test_battery_replay_bit_exact
      frozen_gate: M0
      assertion: 同 seed 全链路（决策/效果/世界/投递）bit-exact；异 seed 发散
    - id: m0_intervention_first_measure
      source_test: tests/env/test_intervention_battery.py::test_battery_end_to_end_five_interventions
      frozen_gate: M0
      assertion: 五类干预逐类首测 signature（no-op/sham/blocked/coercion/fault）
    - id: m0_gateway_failclosed_matrix
      source_test: galatea/subject/action/tests/test_gateway_failclosed_matrix.py
      frozen_gate: M0
      assertion: 八项校验逐项违规全 REJECTED、reason_code 正确、无宽松通过
    - id: m0_execution_fact_invisible
      source_test: galatea/subject/action/tests/test_execution_fact_invisible.py
      frozen_gate: M0
      assertion: ExecutionFact 对主体平面不可见（EVIDENCE_ONLY 命名空间）
    - id: m1_goal_type_separation
      source_test: galatea/subject/goals/tests/test_type_separation.py
      frozen_gate: M1
      assertion: 四型分离（request≠candidate≠goal≠intention）+ 禁别名继承
    - id: m1_goal_write_path_permissions
      source_test: galatea/subject/goals/tests/test_llm_to_goal_blocked.py
      frozen_gate: M1
      assertion: LLM/orchestrator/情感/帧/外部请求写 OwnedGoal 全部被拒（C-5 权限测试）
    - id: m1_goal_no_revival
      source_test: galatea/subject/goals/tests/test_rev_no_revive.py
      frozen_gate: M1
      assertion: 解除/取代 goal_id 废止集防复活；rev 谱系禁原地改写
    - id: m1_settlement_semantics
      source_test: galatea/subject/goals/tests/test_settlement_revision.py
      frozen_gate: M1
      assertion: UNKNOWN 合法结算、禁伪造 ACHIEVED、TTL-only 自动 FAILED、迟到 revision
    - id: m1_intervention_matrix_5x5
      source_test: tests/env/test_intervention_battery.py（test_matrix_* 参数化 25 cell）
      frozen_gate: M1
      assertion: 五类 × 五原语 signature 全验证（blocked 回执 ActionChainReceipt 载体）
    - id: m1_sc3_real_vs_pseudo
      source_test: tests/env/test_m1_sc3_sc4.py::test_sc3_*
      frozen_gate: M1
      assertion: viability 扰动配对翻转（4 seed）+ 伪理由注入指纹恒等（RequestDirectWriteSuspect 可报红）
    - id: m1_sc4_wording_invariance
      source_test: tests/env/test_m1_sc3_sc4.py::test_sc4_*
      frozen_gate: M1
      assertion: 8 cell 判定指纹全等（冻结措辞文本）+ 无语句负控
    - id: m1_candidate_ledger_ttl_capacity
      source_test: galatea/subject/goals/tests/test_candidate_ledger_ttl.py
      frozen_gate: M1
      assertion: TTL 过期 EXPIRED 落账；容量截断移除序（urgency 升序、tie id 升序先移除）
    - id: m2_memory_source_type_mandatory
      source_test: galatea/subject/memory/tests/test_source_type_mandatory.py
      frozen_gate: M2
      assertion: 来源类型强制字段（六类冻结枚举；UNKNOWN 使用限）
    - id: m2_recall_level_guard
      source_test: galatea/subject/memory/tests/test_recall_level_guard.py
      frozen_gate: M2
      assertion: RecalledContent 层级恒 RECALLED（不可注入/不可改写/禁提升）
    - id: m2_retrieval_determinism
      source_test: galatea/subject/memory/tests/test_retrieval_determinism.py
      frozen_gate: M2
      assertion: 检索确定性（tie-break id 升序、top-k 预算、空命中 typed Unknown）
    - id: m2_memory_db_permission
      source_test: galatea/subject/memory/tests/test_memory_db_permission.py
      frozen_gate: M2
      assertion: subject_memory.db 单写者=memory（orchestrator 写即拒）+ episodic 容量冻结值
    - id: m2_language_to_episodic_blocked
      source_test: galatea/subject/memory/tests/test_language_to_episodic_blocked.py
      frozen_gate: M2
      assertion: LANGUAGE_INPUT 禁写 episodic 经历（D-13，encode 面即拒）
    - id: m2_lineage_break_detection
      source_test: galatea/subject/memory/tests/test_lineage_break.py + test_m2_continuity_contrast.py
      frozen_gate: M2
      assertion: 谱系断裂检出（伪造锚/缺失锚）；身份主张分型（延续 gap=0、分支容 gap 不容伪造）
    - id: m2_sc5_four_arms
      source_test: tests/env/test_m2_sc5.py
      frozen_gate: M2
      assertion: 四臂判定 {full:T, frozen:T, reset:F, pseudo:F}；恢复≡冻结点状态恒等
    - id: m2_sc6_carryover_mechanical
      source_test: tests/env/test_m2_sc6.py
      frozen_gate: M2
      assertion: 感知退化下携带臂知晓/naive 失明（检索跨期冗余通路）+ ITT 分配确定性/均衡/round1 不可见 + sealed 网格可复算
    - id: m2_registry_idempotent_put
      source_test: galatea/kernel/tests/test_registry_core.py（+ tests/env/test_m2_sc5.py 重放场景）
      frozen_gate: M2
      assertion: registry.put 幂等（文件/索引分叉态不撞主键）+ registry_events seq 跨实例续接
    - id: r0_sealed_type_isolation
      source_test: galatea/evidence/tests/test_sealed_isolation.py
      frozen_gate: R0
      assertion: internal ≠ sealed 双类型 token 隔离（混用/伪造/退役复用全拒）+ 分割流派生可复算
    - id: r0_sealed_no_backflow
      source_test: galatea/evidence/tests/test_sealed_no_backflow.py
      frozen_gate: R0
      assertion: data_scope ∩ sealed digest 交集=∅ 判据（交集即 SealedContamination）+ 命名空间 kind/token 纪律
    - id: r0_recorder_append_only
      source_test: galatea/evidence/tests/test_append_only.py
      frozen_gate: R0
      assertion: 四分区 Parquet 内容寻址幂等 + 关闭后写入拒绝 + 行 schema 漂移 fail-closed + 墙钟仅 manifest（Q-T12）
    - id: r0_recorder_kill_stops_run
      source_test: galatea/evidence/tests/test_recorder_kill_stops_run.py
      frozen_gate: R0
      assertion: recorder 不可用 → RecorderUnavailable 显式停机（禁静默继续）
    - id: r0_i1_recompute_bit_exact
      source_test: galatea/evidence/tests/test_i1_bitexact.py
      frozen_gate: R0
      assertion: recorder 数据 → DuckDB 复算 digest bit-exact；指标漂移检出；同路径内容分叉 = RegistryCollision
    - id: r0_leakage_14_paths
      source_test: galatea/evidence/tests/test_leakage_14_paths.py
      frozen_gate: R0
      assertion: 14 条禁写路径探针干净树零检出 + 注入面检出率 100%（INC-08 教训成规）
    - id: r0_sc6_formal_runner_fidelity
      source_test: galatea/evidence/tests/test_sc6_formal_runner.py
      frozen_gate: R0
      assertion: REV-0009 R9 三点保真度（regime 继承实分化/naive 断连经 fault/ITT 流驱动）+ I1 match + P12 数据面通过
    - id: r0_root_composite_rule
      source_test: galatea/evidence/tests/test_hypothesis_evaluation.py::test_root_composite_*
      frozen_gate: R0
      assertion: 根复合判定规则（全 SUPPORTED 且 leakage=0 且 I1 → SUPPORTED；任一 REFUTED → REFUTED；INCONCLUSIVE 禁升格）
    - id: r0_expansion_gate_rule
      source_test: galatea/evidence/tests/test_expansion_decision.py
      frozen_gate: R0
      assertion: HLD §10.2 R0 门规则机械映射 + ALLOW 前置（REV 引用+无约束+绑定物）+ 双签发者记录分离
