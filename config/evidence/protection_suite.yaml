# Galatea 证据合同 — 保护场景清单（L13 §4.5 ProtectionSuite；L01 §7"每门退出冻结为保护集"）
# 效力：v1.0 = M1 门版（2026-09-26 追溯冻结——M0/M1 退出时本义务漏执行，INC-12 立案）。
#       v1.1 = M2 门版（2026-09-26，M2 退出单元增补 M2 场景——只增不减纪律）。
#       v1.2 = R0 门版（2026-10-02，R0 退出单元增补 R0 场景——只增不减纪律）。
#       v1.3 = C0 实现期首单元增补（2026-10-03，REV-0011 R7 义务——C0 场景随实现落成即冻，C0 退出时复核）。
#       v1.4 = C1 实现期次单元增补（2026-10-05，INC-12 义务第四次执行——C1 场景随实现落成即冻，c1-exit 复核；
#         REV-0014 R5 勘误：实际 +12 场景至 52，提交信息"+10/50"系计数失实）。
#       v1.5 = C2 实现期首单元增补（2026-10-06，INC-12 义务第五次执行——c2 场景随 affect/ 落成即冻）。
#       v1.6 = C2 实现期次单元增补（2026-10-06，INC-12 义务第六次执行——记忆/workspace 场景随实现落成即冻）。
#       v1.7 = C2 门退出版增补（2026-10-06，INC-12 义务第七次执行——统计评价/值域发现/判定器场景）。
#       v1.8 = C3 实现期首单元增补（2026-10-06，INC-12 义务第八次执行——仲裁/元决策/权限测试场景）。
#       v1.9 = C3 门退出版增补（2026-10-06，INC-12 义务第九次执行——统计评价场景）。
#       v2.0 = C4 实现期首单元增补（2026-10-07，INC-12 义务第十次执行——c4 场景随 language//efference/attribution 落成即冻，c4-exit 复核）。
#       v2.1 = C4 统计评价单元增补（2026-10-08，INC-12 义务第十一次执行——统计计划/runner/机械判据场景）。
#       v2.2 = C5 实现期首单元增补（2026-10-08，INC-12 义务第十二次执行——c5 场景随 promotion/rollback/replay/巩固落成即冻，c5-exit 复核）。
#       v2.3 = E1 实现期增补（2026-10-09，INC-12 义务第十三次执行——60 格闭合/I2 独立性/lesion 选择性场景）。
#       v2.4 = H1 实现期增补（2026-10-10，INC-12 义务第十四次执行——长时运行/恢复/审计/急停语义场景）。
# 纪律：保护集**只增不减**（退役须 DEV_SPEC §4.6 难逆决策裁定 + 记录，禁静默删除）；
# 每门退出前更新本清单（新增该门关键场景 + 复核基线未退化）；基线 = 冻结测试断言
#（确定性模拟中 bit-exact 断言即基线；统计型场景以冻结统计计划为准绳）。
protection_suite:
  id: m1_protection_suite
  version: v2.6                # v2.6（P4-α 评价单元）：新增 p4 场景 3 至 137（INC-12 义务第十六次执行）
                               # v2.5（P1 实现期增补）：新增 p1 场景 6 至 134（INC-12 义务第十五次执行）
  frozen_at: "2026-10-11"   # v2.6（P4-α 评价单元同步；v2.1 为 REV-0021 R5 修正）
  authority: AI-v2
  spec_ref: design/lld/L13_evidence_evaluation_registry.md
  retroactive_note: >
    INC-12（2026-09-26）：L13 §4.5"门退出前冻结保护集"在 M0（ADR-G-0005）与 M1
    （ADR-G-0007）退出时均未履行（REV-0005/0007 均未对照该条）——根因：门退出判据
    映射仅取 HLD §10.2 行 + 对应 LLD §9，未扫描跨档义务。v1.0 为追溯补冻；
    门退出义务核对自本案起将 L13 §4.5 纳入（v1.1 M2 首次正常执行、v1.2 R0 第二次）。
  baseline_semantics: deterministic_bit_exact   # 确定性阶段：测试断言 = 基线；C1+ 噪声组件后换统计基线

