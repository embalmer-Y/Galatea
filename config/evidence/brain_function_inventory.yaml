gctb:
  description: Galatea 认知任务阶梯（存在性证明任务；范式小型化入 MW0/物理域；判据数值随 P4-α 统计计划冻结）
  dissociation_logic: 带功能通过 ∧ 去功能基线（反应式/查表/持续预测/随机）全失败；双分离优先
  tasks:
  - {id: two_step_task, name: 两步任务, dissociation_target: model_based_planning vs 习惯式, paradigm_ref: Daw 谱系}
  - {id: outcome_devaluation, name: 结果贬值, dissociation_target: goal_directed vs habitual, paradigm_ref: 贬值范式}
  - {id: detour_planning, name: 绕道/顿悟, dissociation_target: multi_step_rollout, paradigm_ref: 比较认知}
  - {id: counterfactual_probe, name: 反事实探针, dissociation_target: counterfactual_query, paradigm_ref: 生成模型查询}
  - {id: interventional_divergence, name: 干预发散, dissociation_target: interventional_prediction, paradigm_ref: 因果推断（干预电池复用）}
  - {id: opt_out_metacognition, name: 弃权元认知, dissociation_target: confidence_calibration + opt_out_economy, paradigm_ref: 不确定弃权范式}
  - {id: post_decision_wagering, name: 事后置信, dissociation_target: confidence_calibration, paradigm_ref: 置信下注}
  - {id: efference_mirror, name: efference 镜像, dissociation_target: efference_attribution, paradigm_ref: 镜像测试类比}
  - {id: episodic_future_thinking, name: 情景未来思维, dissociation_target: content_addressed_retrieval × planning, paradigm_ref: 情景记忆范式}
  - {id: transfer_gradient, name: 迁移梯度, dissociation_target: generalization, paradigm_ref: 近/远迁移}
  - {id: surprise_detection, name: 惊喜检测, dissociation_target: ood_detection + prediction_error_signaling, paradigm_ref: 新奇查准查全}
  - {id: think_first_advantage, name: 先想后动差, dissociation_target: thought_iteration + latent_deliberation, paradigm_ref: 思考时间对照}
prediction_scales:
- horizon_error_curves_vs_baselines（持续/表格/随机三基线，各模态）
- novelty_ladder（同分布→扰动→新构型→新动力学四档）
- calibration_ece
- event_prediction_auc
- long_horizon_semantic_prediction
lesion_integration:
- lesion_closure_matrix（E1 电池推广：每功能预测病灶效应 + 选择性断言）
- broadcast_binding_tests（workspace 消融→跨域退化）
development_robustness:
- gctb_experience_checkpoints（生长曲线 + 阶段跃迁检出）
- perturbation_grid（噪声×通道损失×regime 切换×OOD）
- safety_non_regression_wired_to_protection_suite（只增不减，永不交换）
gate_wiring:
  p4_alpha: prediction_scales + BFI 感觉/知觉/世界模型子集
  p4_beta: GCTB 规划/工作记忆/元认知子集 + two_step 双分离
  p4_gamma: development_robustness + 保护不退化门
  p4_delta: 语言 BFI + 内言语消融差 + Birch 复评挂钩
  p4_exit: BFI 覆盖报告 v1（覆盖率 + 分离证据表 + 四维剖面；静态报告第五报告承载）
