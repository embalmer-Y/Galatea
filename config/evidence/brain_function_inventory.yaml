# BFI 脑功能清单 + 脑功能完备性评估体系（Q-L13-19 / ADR-G-0029 §5）
# v1.0 定稿——结构 + 首评冻结；各任务判据数值随 P4-α 统计计划冻结（运行前）。
# 认识论立场：完备不可由有限任务集证明；可认证 = 覆盖率 + 分离证据 + 整合证据 + 发育证据（四维剖面）。
# 功能/现象两轴分离：birch_markers.yaml（现象层）独立，不并入功能分。
meta:
  id: brain_function_inventory
  version: v1.0
  status: FROZEN
  frozen_at: "2026-10-11"
  authority: AI-v2
  authority_ref: ADR-G-0029
  register_ref: Q-L13-19
  criteria_numeric_status: margin_family_frozen_gctb_deferred_p4_beta   # REV-0028 R3 处置更新（2026-10-16）
  # 判据数值处置：margin 族已随 stat plan p4_alpha v1.4 冻结（median 0.042997 < 阈 0.1——
  # 确认性重评 SUPPORTED 实证）；**GCTB P4-β 子集（two_step/opt_out/wagering/surprise/ think_first）
  # 数值已随 stat plan p4_beta_mind v1.0 冻结（2026-10-16，探针 ADR-G-0033）——REV-0028 R3 兑现**；
  # γ/δ 子集随其准备单元（显式登记）。
  # REV-0028 R3 迟延登记（2026-10-13）：ADR-G-0030 §5「BFI 判据数值随 stat plan 冻结」未兑现——stat plan
  # p4_alpha v1.0–v1.3 仅覆盖 margin/dual/replay 三 claim，GCTB 12 任务数值未冻。迟延原因：P4-α 首评
  # margin REFUTED（Q-L04-13 owner 决策等待期），GCTB 数值冻结随重评单元一并执行（禁静默缺席）。
  phenomenal_layer_separate: birch_markers.yaml
status_vocabulary:
- NOT_ASSESSED
- ABSENT
- PARTIAL
- PRESENT
- UNDETERMINABLE
first_assessment:
  method: 首评 = 既有门证据逐项映射（判据引用为门退出 EvidenceResult/裁决号；数值判据未冻）
  counts: {PRESENT: 32, PARTIAL: 17, ABSENT: 11, total: 60}
  note: ABSENT 集中于反事实/泛化/对象抽象/思维迭代/内言语——与预测脑 v2 立项诊断一致（ADR-G-0029 §1）
completeness_logic:
  existence_proof: 带该功能通过存在性任务 ∧ 全部去该功能基线失败（基线耗尽机械化）
  double_dissociation_preferred: 相邻功能对经双病灶双任务交叉（金标准；E1 电池推广）
  no_dead_organs: 每模块消融致至少一项功能退化（无冗余器官）
  no_orphan_functions: 每个 PRESENT 功能有通过的存在性任务 + 选择性病灶面（无无证据主张）
  integration: workspace 广播/结合测试（lesion 后跨域退化）
  report_form: 四维剖面 + 覆盖率，版本册只增不减；永不宣称终局完备
systems:
- id: sensory
  name: 感觉系统
  functions:
  - {id: channel_encoding, name: 通道编码与忠实变换, status: PRESENT,
     evidence_ref: C0 形成面 FormationReceipt digest 双绑定 + P1/P2 物理通道（Q-L01-10/Q-L01-11；R-p1-physio-001 fidelity SUPPORTED）}
  - {id: prediction_error_signaling, name: 感觉预测误差信号（预测编码层）, status: PARTIAL,
     evidence_ref: L02 pred_error 结构在位（Q-L02-06 formed_features_flat）——手工残差，学习预测编码层 = P4-α/β}
  - {id: precision_attention_weighting, name: 精度/注意加权（增益面）, status: PRESENT,
     evidence_ref: R-c2-modulation-001 SUPPORTED gain d=55.09（三通道调制闭环）}
  - {id: calibration, name: 校准与漂移防护, status: PRESENT,
     evidence_ref: c0-static-v1 单版本冻结 + 漂移计数（Q-L02-01）+ P1 v1.1 运行前修订先例}
  - {id: ood_detection, name: 域外/新奇检出, status: PARTIAL,
     evidence_ref: L03 OOD 事件级域出 + typed unknown（C1）；感觉层自身 OOD 深化 = P4 件}
- id: perception_inference
  name: 知觉推断
  functions:
  - {id: iterative_inference, name: 迭代潜状态推断（多轮修正）, status: PARTIAL,
     evidence_ref: 单遍表格后验 + 多假设塌缩/重开（Q-L03-05）；摊销迭代推断 = P4-α}
  - {id: posterior_quality, name: 后验质量与校准（ECE 族）, status: PRESENT,
     evidence_ref: R-c1-tracking-001 SUPPORTED ECE=0.0 端点零错误 15 箱（Q-L03-04）}
  - {id: multimodal_fusion, name: 多模态融合与冲突处理, status: PRESENT,
     evidence_ref: C1 事件双模态融合 + CONFLICTING_EVIDENCE 类型化（L03 §10）}
  - {id: ambiguity_handling, name: 歧义保持（多假设）与塌缩, status: PRESENT,
     evidence_ref: 上限 4 + 双条件塌缩/重开（Q-L03-05/Q-L04-02）}
  - {id: hallucination_resistance, name: 抗幻觉（不确定即弃权）, status: PRESENT,
