  - {id: one_step_prediction, name: 单步预测, status: PRESENT,
     evidence_ref: R-c1-worldpred-002 SUPPORTED（值空间预测优于持续基线）}
  - {id: multi_step_rollout, name: 多步想象推演, status: PARTIAL,
     evidence_ref: ≤8 步×4 分支确定性 rollout（Q-L04-01）——视野封顶，价值摘要 Unknown；潜空间无界推演 = P4-α/β}
