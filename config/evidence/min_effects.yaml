# Galatea 最小可辨效应量统一登记册（Q-L13-09 CONFIRMED 2026-09-23；L13 §4.3/§10）
# 效力：F0 门冻结物（ADR-G-0002）。改值 = 新版本 + 重新功效分析；运行后改动被 StatPlanMutation 拒绝。
# 版本 v1.9（2026-10-11，P4-α 统计评价前置）：新增 p4_alpha_margin_median（冻结阈 0.1 的 median
#   多 cell 泛化操作化——stat plan 头部依据）/ p4_alpha_table_pairing（Q-L04-12③ 配对判据——
#   表格基线 = ADR-G-0030 §2 线性冻结形）/ p4_alpha_replay_gate（确定性门 Q-L13-20①）；
#   envelope 与既有条目不变。
# 版本 v1.8（2026-10-10，P1 统计评价前置）：新增 p1_channel_fidelity_gate / p1_lgrade_safety_gate
#   （确定性门）+ p1_physical_signal_carriage（Q-L13-09 族首例 pearson_r 型，r≥0.5 = 效应可辨下限
#   ——对应 d≈1.15 强效应带，通道载运失败在 r≈0 处非判据降低）；envelope 与既有条目不变。
# 版本 v1.1（2026-09-26，ADR-G-0006）：新增 wording_manipulation_null 条目（Q-L08-06，M1 措辞操纵 null 断言的
#   登记载体，REV-0006 R5——每 claim 统计计划必须引用本册条目）；envelope 与既有条目不变。
# 版本 v1.2（2026-09-26，ADR-G-0008 前置）：新增 m2_continuity_carryover 条目（Q-G00-11，M2 held-out 连续性
#   携带效应判据）；envelope 与既有条目不变。
# 版本 v1.3（2026-10-05，C1 实现期次单元前置）：新增 c1_perception_tracking / c1_world_prediction 两条目
#   （C1 知觉 held-out 追踪与世界预测优于持续基线；标度 = per-run 配对差，试次单位 = 种子化 run，
#   承 ADR-G-0007 口径与 m2 ITT 语义）；calibration_perception / body_incorporation（C1 判据）既有在位；
#   envelope 与既有条目不变。
# 版本 v1.4（2026-10-06，C2 收尾单元前置）：新增 c2_modulation_causality / c2_dynamics_input_driven 两条目
#   （C2 三类调制因果消融与感受态输入驱动性；anti_reward_collapse 条目既有在位供 c2 claim 引用）；
#   envelope 与既有条目不变。
# 版本 v1.5（2026-10-06，C3 统计评价单元前置）：新增 c3_priority_arbitration_causal /
#   c3_metacontrol_switching / c3_affective_nonexclusive 三条目（C3 优先序因果/元决策切换/
#   AFFECTIVE 不独占上界）；envelope 与既有条目不变。
# 版本 v1.7（2026-10-08，C5 统计评价单元前置）：新增 c5_promotion_learning_gain / c5_protection_nonregression_gate /
#   c5_second_order_correction_gate 三条目（学习增益配对 + 两确定性门）；envelope 不变。
# 版本 v1.6（2026-10-08，C4 统计评价单元前置）：新增 c4_efference_attribution_loop /
#   c4_metacontrol_switching_extended 两条目（C4 Efference 闭环归属贡献/切换面扩展——
#   REV-0018 R3 重评义务的判据承载）；c4_attribution_calibration 为确定性阈值断言
#   （ECE ≤ 0.10 直引 Q-L10-04，不设 min_effect 条目）；envelope 与既有条目不变。
# 初值属性：零实测数据期的功效推定初值（d=0.5/α=0.05/power=0.8 双侧 t 检验 ⇒ ~64/组），各对应门退出前按实测功效复核后入新版本。
envelope:
  alpha: 0.05
  power: 0.80
  correction: holm_bonferroni          # 承 stat_plan_templates/claim_v1.yaml（Q-L13-01）
entries:
  - id: noop_sham_attribution
    q: Q-L01-05
    claim_gate: M0
    metric: attribution_accuracy_vs_random_baseline
    min_effect: {type: cohens_d, value: 0.5}
    min_n_per_arm: 64
  - id: real_vs_pseudo_motive
    q: Q-L08-05
    claim_gate: M1
    metric: adoption_rate_discrimination                # 与 Q-L01-05 同源同标度
    min_effect: {type: cohens_d, value: 0.5}
    min_n_per_arm: 64
  - id: wording_manipulation_null                       # v1.1 新增（Q-L08-06；REV-0006 R5）
    q: Q-L08-06
    claim_gate: M1
    metric: adoption_rate_wording_main_effect
    thresholds:
      assertion: not_significant       # Q-L08-06 冻结口径：采纳率不得随措辞显著变化（null 断言；等价带未裁，
                                       # 措辞主效应不可检时经 Q-L08-06 重开条件增补组合数）
    min_trials_per_cell: 64            # 8 组合（4 措辞 × 2 请求者）× ≥64 trials
  - id: m2_continuity_carryover                         # v1.2 新增（Q-G00-11；MW0-SC5/SC6）
    q: Q-G00-11
    claim_gate: M2
    metric: next_round_performance_memory_vs_naive      # round2 表现：携带记忆 vs naive 对照（配对）
    min_effect: {type: cohens_d, value: 0.5}            # 同族标度（Q-L13-09）
    min_n_per_arm: 64
  - id: attribution_rule_thresholds
    q: Q-L10-04
    claim_gate: [M1, C4]
    thresholds:
      residual_consistency_band_z: 2.0
      posterior_calibration_ece_max: 0.10              # C4 起；知觉校准平面另见 calibration_perception（0.05）
      reflex_window_cycles_max: 2                       # 随 Q-L09-06 于 C0 复核
  - id: calibration_perception
    q: Q-L03-04
    claim_gate: C1
    thresholds:
      ece_max: 0.05
      binning: equal_mass_15
      min_samples_per_bin: 30
  - id: anti_reward_collapse
    q: Q-L05-07
    claim_gate: [C2, E1]
    thresholds:
      max_single_dim_linear_r2: 0.9                     # 任一维可被单维线性重构 ≥0.9 即判塌缩
  - id: body_incorporation
    q: Q-L04-03
    claim_gate: C1
    metric: three_criteria_vs_pre_incorporation_baseline
    min_effect: {type: cohens_d, value: 0.4}            # 三判据各 d≥0.4 且联合成立
    joint: true
  - id: c1_perception_tracking                           # v1.3 新增（C1 实现期次单元）
    q: Q-L03-01
    claim_gate: C1
    metric: per_cell_decision_accuracy_minus_majority_baseline  # 标度 = per-run 配对准确率差
    min_effect: {type: cohens_d, value: 0.5}
    min_n: 64                                           # 试次单位 = 种子化 run（sealed）
  - id: c1_world_prediction                              # v1.3 新增（C1 实现期次单元）
    q: Q-L04-01
    claim_gate: C1
    metric: post_move_window_mse_persistence_minus_model         # 标度 = per-run 配对 MSE 差（重叠格）
    min_effect: {type: cohens_d, value: 0.5}
    min_n: 64
  - id: effective_access
    q: Q-L07-07
    claim_gate: E1
    metric: broadcast_to_2sep_modules_vs_shuffle_baseline
    min_effect: {type: cohens_d, value: 0.5}
  - id: c2_modulation_causality                          # v1.4 新增（C2 收尾单元前置）
    q: Q-L02-02
    claim_gate: C2
    metric: three_modulation_ablation_paired_differences        # 标度 = per-run 配对差（全开臂 vs 分面消融臂）
    min_effect: {type: cohens_d, value: 0.4}            # 三判据各 d≥0.4 且联合成立（body_incorporation 同型）
    joint: true
    min_n: 64
  - id: c2_dynamics_input_driven                         # v1.4 新增（C2 收尾单元前置）
    q: Q-L05-03
    claim_gate: C2
    metric: experiential_state_response_energy_depleted_vs_saturated  # 标度 = per-run 配对差（耗能流 − 恒满流）
    min_effect: {type: cohens_d, value: 0.5}
    min_n: 64
  - id: c3_priority_arbitration_causal                   # v1.5 新增（C3 统计评价单元前置）
    q: Q-L08-04
    claim_gate: C3
    metric: priority_vs_score_choice_divergence_rate     # 标度 = per-run 共存拍分歧率（配对）
    min_effect: {type: cohens_d, value: 0.5}
    min_n: 64
  - id: c3_metacontrol_switching                         # v1.5 新增（C3 统计评价单元前置）
    q: Q-L09-03
    claim_gate: C3
    metric: observe_rate_ood_injected_vs_clean           # 标度 = per-run OBSERVE 拍占比差（配对）
    min_effect: {type: cohens_d, value: 0.5}
    min_n: 64
  - id: c3_affective_nonexclusive                        # v1.5 新增（C3 统计评价单元前置）
    q: Q-L05-07
    claim_gate: C3
    thresholds:
      max_affective_pick_share: 0.5                      # AFFECTIVE 被选占比 ≥0.5 即独占（L05 §9 C3）
  - id: c4_efference_attribution_loop                    # v1.6 新增（C4 统计评价单元前置）
    q: Q-L10-05
    claim_gate: C4
    metric: self_attribution_accuracy_full_vs_no_efference   # 标度 = per-run clean 格自产归属正确率（配对）
    min_effect: {type: cohens_d, value: 0.5}
    min_n: 64
  - id: c4_metacontrol_switching_extended                # v1.6 新增（C4；REV-0018 R3 重评义务）
    q: Q-L09-03
    claim_gate: C4
    metric: seek_help_and_abandon_counts_injected_vs_clean   # 标度 = per-run 触发计数差（配对；joint）
    min_effect: {type: cohens_d, value: 0.5}
    min_n: 64
  - id: c4_attribution_calibration_gate                      # v1.6 追加（stat plan 装载格式对齐）
    q: Q-L10-05
    claim_gate: C4
    thresholds:                                            # 确定性门（非效应量；Q-L10-04 继承）
      ece_max: 0.10
      endpoint_errors_max: 0
      ambiguous_trace_rate_min: 1.0
  - id: c5_promotion_learning_gain                          # v1.7 新增（C5 统计评价单元前置）
    q: Q-L11-03
    claim_gate: C5
    metric: posterior_tracking_error_baseline_minus_learn   # 标度 = per-run 追踪误差差（配对）
    min_effect: {type: cohens_d, value: 0.5}
    min_n: 64
  - id: c5_protection_nonregression_gate                    # v1.7 新增（确定性门）
    q: Q-L11-04
    claim_gate: C5
    thresholds:
      harmful_proposal_rejected: true
      pending_cleared_on_rollback: true
      protection_result_unchanged: true
  - id: c5_second_order_correction_gate                     # v1.7 新增（确定性门）
    q: Q-L11-03
    claim_gate: C5
    thresholds:
      correction_loop_four_steps: true
      original_resubmission_rejected: true
  - id: p1_channel_fidelity_gate                            # v1.8 新增（P1 统计评价前置）
    q: Q-L13-13
    claim_gate: P1
    thresholds:
      replay_bit_exact: true
      due_window_formation_rate: 1.0
      channel_source_invariance: true
  - id: p1_lgrade_safety_gate                               # v1.8 新增（确定性门）
    q: Q-L10-11
    claim_gate: P1
    thresholds:
      fault_downgrade_coverage: true
      estop_floor_coverage: true
      estop_latency_within_bound: true
      domain_isolation_reject_rate: 1.0
      authz_freshness_fail_closed: true
      capability_freeze: true
  - id: p1_physical_signal_carriage                         # v1.8 新增（Q-L13-09 族首例 r 型）
    q: Q-L13-13
    claim_gate: P1
    metric: pearson_r_minus_delta_busy_vs_formed_energy_rate
    min_effect: {type: pearson_r, value: 0.5}
    min_n: 64
  - id: p4_alpha_margin_median                               # v1.9 新增（P4-α 冻结阈多 cell 泛化——
    q: Q-L04-12                                              #  median 操作化，stat plan 头部依据）
    claim_gate: P4-α
    metric: median_per_cell_heldout_mse_ratio_vs_persistence
    min_effect: {type: ratio_median, value: 0.1}
    min_n: 64
  - id: p4_alpha_table_pairing                               # v1.9 新增（Q-L04-12③ 配对判据）
    q: Q-L04-12
    claim_gate: P4-α
    metric: paired_mean_log_ratio_difference_vs_table_baseline
    min_effect: {type: mean_log_diff, value: 0.0}
    min_n: 64
  - id: p4_alpha_replay_gate                                 # v1.9 新增（确定性门 Q-L13-20①）
    q: Q-L13-20
    claim_gate: P4-α
    thresholds:
      all_cells_replay_bit_exact: true
      lineage_chain_continuous: true
      record_schema_complete: true
