# PhysIO west 工作区清单
#
# ⚠ 状态：RESEARCH 期草案（2026-09-16）。
#   - 本仓库当前**没有任何可构建目标**（module/ 与 app/galatea_node 仅有 .gitkeep 空目录），
#     因此本清单现阶段**不可用于构建**，仅作依赖关系的记录草案。
#   - revision: v4.4.0 是草案值，待 Q-PIO-01 裁决（候选：4.5 / LTS4 / LTS3）后确认。
#   - 实现产物按流程 research → HLD → LLD → 实施，在 HLD/LLD 冻结后才生成。
#   - 若 Q-PIO-07b 裁决为引入 Zenoh，需在 projects 里新增 zenoh-pico（eclipse-zenoh/zenoh-pico，
#     不在 Zephyr 官方 default manifest，须自行声明并 pin revision；它自带 zephyr/module.yml）。
#
# 用法（工作区在本仓库之外初始化，Zephyr 树不进 Galatea 仓库）：
#   mkdir physio-ws && cd physio-ws
#   west init -l <path/to/Galatea>/physio
#   west update
# 届时 Zephyr 树克隆到 physio-ws/zephyr，本仓库按 self.path 落在 physio-ws/physio。
manifest:
  self:
    path: physio

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  defaults:
    remote: zephyrproject-rtos
    revision: v4.4.0          # 锁版本；Q-PIO-01 裁决后调整（候选：v4.5 / LTS4）
    import: true              # 导入 Zephyr 自身的全部模块

  projects:
    # 需要额外第三方模块时在此追加
    # - name: mcuboot
    #   path: bootloader/mcuboot
    #   revision: v2.1.0
